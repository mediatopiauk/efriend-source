<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Chrome | UX Master Chief</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--foundation-wash); }
  * { box-sizing: border-box; }
  body { min-height: 100vh; font-family: var(--font-body); }

  /* Sticky top chrome wrapper */
  .chrome-mount { position: sticky; top: 0; z-index: 40; }

  /* ---- Ticker marquee ---- */
  @keyframes dash-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .dash-ticker-track { animation: dash-marquee 34s linear infinite; will-change: transform; }
  .dash-ticker:hover .dash-ticker-track { animation-play-state: paused; }

  /* ---- Demo dashboard backdrop (context only; not part of the chrome) ---- */
  .demo-body { max-width: 1280px; margin: 0 auto; padding: 28px 32px 96px; }

  .welcome {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 20px; flex-wrap: wrap;
    background: var(--foundation-white);
    border: 1px solid var(--foundation-pale);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    padding: 24px 26px; margin-bottom: 22px;
  }
  .welcome h1 {
    margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700;
    letter-spacing: -0.025em; color: var(--foundation-dark);
  }
  .welcome p { margin: 6px 0 0; font-size: 14.5px; color: var(--foundation-mid); }
  .welcome .who {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 10px; border: 1px solid var(--foundation-pale);
    border-radius: var(--radius-full); background: var(--foundation-white);
  }
  .welcome .who .av {
    width: 30px; height: 30px; border-radius: 999px; background: var(--brand-indigo);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    font-family: var(--font-display);
  }
  .welcome .who .nm { font-size: 13.5px; font-weight: 600; color: var(--foundation-dark); }
  .welcome .who .pl { font-size: 12.5px; color: var(--foundation-mid); }

  .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
  .stat {
    background: var(--foundation-white); border: 1px solid var(--foundation-pale);
    border-radius: var(--radius-md); box-shadow: var(--shadow-xs); padding: 20px 22px;
  }
  .stat .lbl { font-size: 12.5px; font-weight: 600; color: var(--foundation-mid); }
  .stat .val {
    font-family: var(--font-display); font-size: 30px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--foundation-dark); margin-top: 8px;
  }
  .stat .cap { font-size: 12px; color: var(--foundation-mid); margin-top: 6px; }

  .hint-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 auto 0; max-width: 1280px; padding: 14px 32px 0;
    font-size: 12.5px; color: var(--foundation-mid);
  }
  .hint-bar code {
    font-family: var(--font-mono); font-size: 11.5px; background: var(--foundation-white);
    border: 1px solid var(--foundation-pale); border-radius: var(--radius-xs); padding: 2px 7px;
    color: var(--foundation-slate);
  }

  @media (max-width: 880px) {
    .card-grid { grid-template-columns: 1fr; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

      <path d="M96 124a14 14 0 0 1-26-7"/>

<div id="root"></div>

<script type="text/babel" src="components/Shared.jsx"></script>
<script type="text/babel" src="components/SettingsShared.jsx"></script>

<script type="text/babel" src="components/DashboardChrome.jsx"></script>

<script type="text/babel">

    <div className="demo-body">

            width: 46, height: 46, borderRadius: 'var(--radius-md)',

          <div>
            <h1>Welcome back, Duncan</h1>

        </div>
        <div className="who">

</body>
</html>
